name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Em PRs, um novo push cancela a execução anterior; na main e na develop, nada é interrompido.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vacinacao
          POSTGRES_USER: vacinacao
          POSTGRES_PASSWORD: vacinacao
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: chave-usada-somente-no-ci
      DB_NAME: vacinacao
      DB_USER: vacinacao
      DB_PASSWORD: vacinacao
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar dependências
        run: python -m pip check

      - name: Verificar configuração
        run: python manage.py check

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings

      - name: Testes com SQLite em memória
        run: python manage.py test usuarios vacinacao --settings=config.test_settings

      - name: Testes com PostgreSQL
        run: python manage.py test usuarios vacinacao

  frontend:
    name: Frontend — testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  imagens:
    name: Imagem Docker — ${{ matrix.servico }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [backend, frontend]
    env:
      # As imagens só são publicadas em pushes na main; nos demais casos, apenas são construídas.
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nomes e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.servico }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servico }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  deploy:
    name: Deploy
    needs: imagens
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Acionar a hospedagem
        env:
          DEPLOY_HOOK_BACKEND: ${{ secrets.DEPLOY_HOOK_BACKEND }}
          DEPLOY_HOOK_FRONTEND: ${{ secrets.DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$DEPLOY_HOOK_BACKEND" ] && [ -z "$DEPLOY_HOOK_FRONTEND" ]; then
            echo "::notice::Hospedagem ainda não configurada. As imagens foram publicadas no GHCR; cadastre os segredos DEPLOY_HOOK_BACKEND e DEPLOY_HOOK_FRONTEND no ambiente 'producao' para ativar o deploy."
            exit 0
          fi
          if [ -n "$DEPLOY_HOOK_BACKEND" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_BACKEND" > /dev/null
            echo "Deploy do backend acionado."
          fi
          if [ -n "$DEPLOY_HOOK_FRONTEND" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_FRONTEND" > /dev/null
            echo "Deploy do frontend acionado."
          fi
